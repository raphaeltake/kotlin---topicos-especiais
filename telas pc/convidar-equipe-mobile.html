<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convidar para Equipe (Mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAFC;
    --card-main:#FFFFFF;
    --text:#1E293B;
    --accent:#2563EB;
    --pending:#22C55E;
    --progress:#F59E0B;
    --expiring:#EF4444;
    --border:#64748B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#E2E8F0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px;
    font-family:'Poppins', sans-serif;
    color:var(--text);
    min-height:100vh;
  }
  .font-nunito{ font-family:'Nunito', sans-serif; }

  .phone{
    width:390px;
    max-width:100%;
    height:844px;
    background:var(--bg);
    border-radius:44px;
    border:10px solid #0F172A;
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(15,23,42,.45);
    display:flex;
    flex-direction:column;
  }
  .status-bar{
    height:44px;
    flex:0 0 auto;
    background:var(--card-main);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    font-size:13px;
    font-weight:600;
  }
  .status-bar .icons{ display:flex; align-items:center; gap:5px; }
  .status-bar svg{ width:16px; height:16px; }

  .topbar{
    flex:0 0 auto;
    background:var(--card-main);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px 14px;
    border-bottom:1px solid #E2E8F0;
  }
  .topbar .left{ display:flex; align-items:center; gap:12px; }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:4px;
  }
  .icon-btn svg{ width:22px; height:22px; }
  .logo svg{ width:24px; height:24px; }
  .topbar .right{ display:flex; align-items:center; gap:14px; }

  .content{
    flex:1 1 auto;
    overflow-y:auto;
    padding:24px 16px 110px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .page-card{
    background:var(--card-main);
    border-radius:16px;
    padding:24px 18px;
  }
  .page-title{
    font-size:19px;
    font-weight:700;
    text-align:center;
    margin-bottom:20px;
    line-height:1.3;
  }

  /* ---- team code ---- */
  .code-box{
    background:var(--bg);
    border-radius:12px;
    padding:12px 16px;
    text-align:center;
    margin:0 auto 24px;
  }
  .code-box .label{ font-size:12.5px; font-weight:600; margin-bottom:4px; }
  .code-box .code-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .code-box .code{ font-size:16px; font-weight:600; letter-spacing:.3px; }
  .code-box .copy-btn{ color:var(--accent); }
  .code-box .copy-btn svg{ width:16px; height:16px; }

  /* ---- email input ---- */
  .field-label{ font-size:13px; font-weight:600; margin-bottom:6px; display:block; }
  .email-input{
    width:100%;
    background:var(--bg);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Poppins', sans-serif;
    font-size:14px;
    color:var(--text);
    margin-bottom:18px;
  }
  .email-input:focus{ outline:none; border-color:var(--accent); }
  .email-input::placeholder{ color:#94A3B8; }

  /* ---- email list ---- */
  .email-list-box{
    background:var(--bg);
    border-radius:12px;
    padding:14px;
  }
  .email-list-box .label{ font-size:13px; font-weight:600; margin-bottom:10px; }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; min-height:32px; }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--card-main);
    border:1px solid #E2E8F0;
    border-radius:999px;
    padding:5px 6px 5px 12px;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
  }
  .chip button{
    background:var(--accent);
    border:none;
    color:var(--card-main);
    width:16px;
    height:16px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .chip button svg{ width:9px; height:9px; }

  /* ---- bottom action ---- */
  .bottom-actions{
    position:absolute;
    left:0; right:0; bottom:0;
    background:var(--card-main);
    border-top:1px solid #E2E8F0;
    padding:12px 16px 20px;
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:var(--card-main);
    border:none;
    border-radius:12px;
    padding:13px 16px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .btn-primary svg{ width:18px; height:18px; }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8c5-4 15-4 20 0M5 12c4-3 10-3 14 0M8.5 16c2-1.5 5-1.5 7 0" stroke-linecap="round"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="10" rx="2"/><rect x="21" y="11" width="2" height="4" fill="currentColor" stroke="none"/><rect x="4" y="10" width="12" height="6" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>

  <header class="topbar">
    <div class="left">
      <button class="icon-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 9l5 9 5-11 5 11 5-9" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="right">
      <button class="icon-btn" aria-label="Notificações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9z" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="content">
    <section class="page-card">
      <h1 class="page-title">Convide pessoas<br>para sua equipe</h1>

      <div class="code-box">
        <div class="label">Código da equipe:</div>
        <div class="code-row">
          <span class="code">12hg37f9d9</span>
          <button class="icon-btn copy-btn" aria-label="Copiar código">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <label class="field-label" for="email-field">E-mail:</label>
      <input class="email-input" id="email-field" type="email" placeholder="nome@email.com">

      <div class="email-list-box">
        <div class="label">Lista de e-mails:</div>
        <div class="chip-wrap">
          <span class="chip">email@email.com <button aria-label="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></span>
          <span class="chip">email@email.com <button aria-label="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></span>
          <span class="chip">email@email.com <button aria-label="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></span>
          <span class="chip">email@email.com <button aria-label="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></span>
          <span class="chip">email@email.com <button aria-label="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></span>
        </div>
      </div>
    </section>
  </div>

  <div class="bottom-actions">
    <button class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6" stroke-linecap="round"/></svg>
      Convidar
    </button>
  </div>

</div>

</body>
</html>
